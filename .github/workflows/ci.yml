name: ci
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc cmake ninja-build
      - run: cmake -S host -B host/build -G Ninja
      - run: cmake --build host/build
      - run: ctest --test-dir host/build --output-on-failure
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make -C stm32 -j2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: stm32/build/InduLogger.elf
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck (hand-written code only, generated/vendor trees excluded)
        run: |
          DIRS=""
          for d in stm32/app stm32/bsp stm32/platform stm32/middleware host; do
            [ -d "$d" ] && DIRS="$DIRS $d"
          done
          cppcheck --std=c11 --platform=unix64 --enable=warning,style --error-exitcode=1 \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --suppress=constParameterPointer:stm32/bsp/uart_link/uart_link.c \
            -i host/third_party -i host/build $DIRS
      - name: cppcheck MISRA add-on (protocol library)
        run: |
          ADDON=$(ls /usr/lib/*/cppcheck/addons/misra.py /usr/share/cppcheck/addons/misra.py 2>/dev/null | head -1)
          if [ -z "$ADDON" ]; then echo "::error::MISRA add-on not found in cppcheck package"; exit 1; fi
          cppcheck --addon="$ADDON" --std=c11 --platform=unix64 --error-exitcode=1 \
            --suppress=missingInclude --suppress=missingIncludeSystem stm32/middleware
